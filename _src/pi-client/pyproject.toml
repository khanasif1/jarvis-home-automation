[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "home-assistant-pi"
version = "2.0.0"
description = "Low-latency wake-word voice client for Raspberry Pi 3B"
readme = "README.md"
requires-python = "==3.11.*"
license = "MIT"
authors = [{ name = "jarvis-home-automation contributors" }]
keywords = ["raspberry-pi", "voice-assistant", "wake-word", "streaming"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Operating System :: POSIX :: Linux",
  "Intended Audience :: End Users/Desktop",
]
dependencies = [
  "openwakeword==0.6.0",
  "requests>=2.32,<3",
  "sounddevice>=0.5,<1",
  "webrtcvad-wheels>=2.0.14,<3",
]

[project.urls]
Homepage = "https://github.com/khanasif1/jarvis-home-automation"
Issues = "https://github.com/khanasif1/jarvis-home-automation/issues"

[project.scripts]
home-assistant-pi = "home_assistant_pi.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
home_assistant_pi = ["assets/*.wav"]
