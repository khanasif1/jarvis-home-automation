openapi: 3.1.0
info:
  title: Jarvis streaming voice API
  version: 2.0.0
  description: >
    Turn-based HTTP streaming of raw PCM from one Raspberry Pi to an Azure
    Function and raw PCM response audio back to the Pi.
servers:
  - url: https://YOUR-FUNCTION.azurewebsites.net
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Check Function availability
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    const: ok
  /api/voice/stream:
    post:
      operationId: streamVoiceTurn
      summary: Upload one live command and stream one spoken response
      security:
        - DeviceGuid: []
      parameters:
        - $ref: "#/components/parameters/InputSampleRate"
        - $ref: "#/components/parameters/InputChannels"
        - $ref: "#/components/parameters/InputSampleWidth"
      requestBody:
        required: true
        content:
          audio/pcm:
            schema:
              type: string
              format: binary
              description: >
                Headerless little-endian PCM16 mono at 16 kHz. The body may use
                chunked transfer encoding and must contain at most 960,000
                bytes (30 seconds).
      responses:
        "200":
          description: Streamed spoken response
          headers:
            Cache-Control:
              schema:
                const: no-store
            X-Audio-Sample-Rate:
              schema:
                const: "24000"
            X-Audio-Channels:
              schema:
                const: "1"
            X-Audio-Sample-Width:
              schema:
                const: "2"
          content:
            audio/pcm:
              schema:
                type: string
                format: binary
                description: Headerless little-endian PCM16 mono at 24 kHz.
        "400":
          $ref: "#/components/responses/InvalidAudio"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/InvalidAudio"
        "415":
          $ref: "#/components/responses/InvalidAudio"
        "500":
          $ref: "#/components/responses/ServerError"
        "502":
          $ref: "#/components/responses/FoundryError"
components:
  securitySchemes:
    DeviceGuid:
      type: apiKey
      in: header
      name: X-Device-Guid
      description: Fixed canonical lowercase UUID configured on the Pi and Function.
  parameters:
    InputSampleRate:
      name: X-Audio-Sample-Rate
      in: header
      required: true
      schema:
        const: "16000"
    InputChannels:
      name: X-Audio-Channels
      in: header
      required: true
      schema:
        const: "1"
    InputSampleWidth:
      name: X-Audio-Sample-Width
      in: header
      required: true
      schema:
        const: "2"
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    InvalidAudio:
      description: The PCM body, headers, alignment, or duration is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: The device GUID is missing, malformed, or incorrect.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    FoundryError:
      description: Foundry rejected or failed the Realtime turn before output began.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: Backend configuration or an unexpected server operation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
