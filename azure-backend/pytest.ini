[pytest]
; Allows `pytest azure-backend/tests` to work without manually exporting
; PYTHONPATH=azure-backend/src (CI still sets it explicitly for clarity).
pythonpath = src
testpaths = tests
; Keep every generated artifact (cache, coverage) under the repository-root
; .test-artifacts/ directory instead of inside azure-backend/.
cache_dir = ../.test-artifacts/pytest_cache/azure-backend
addopts = -ra
