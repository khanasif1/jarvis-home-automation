name: Azure backend CI

on:
  pull_request:
    paths:
      - "azure-backend/**"
      - "contracts/**"
      - ".github/workflows/azure-backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "azure-backend/**"
      - "contracts/**"
      - ".github/workflows/azure-backend-ci.yml"

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: azure-backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --requirement azure-backend/requirements-dev.txt
      - name: Test
        env:
          PYTHONPATH: azure-backend/src
        run: python -m pytest azure-backend/tests --basetemp=.test-artifacts/pytest/backend
      - name: Compile runtime
        run: python -m compileall -q azure-backend/function_app.py azure-backend/src
