name: Pi client CI

on:
  pull_request:
    paths:
      - "pi-client/**"
      - "contracts/**"
      - ".github/workflows/pi-client-ci.yml"
  push:
    branches: [main]
    paths:
      - "pi-client/**"
      - "contracts/**"
      - ".github/workflows/pi-client-ci.yml"

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pi-client/requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install --requirement pi-client/requirements-dev.txt
      - name: Test
        run: python -m pytest pi-client/tests --basetemp=.test-artifacts/pytest/pi-client
      - name: Verify private release authentication
        run: bash pi-client/tests/update-auth-smoke.sh
      - name: Lint
        run: >-
          python -m ruff check
          pi-client/src
          pi-client/tests
          pi-client/packaging/create-release-archive.py
      - name: Prepare isolated build source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .test-artifacts/pi-build-source
          cp pi-client/pyproject.toml pi-client/README.md .test-artifacts/pi-build-source/
          cp -a pi-client/src .test-artifacts/pi-build-source/
      - name: Build wheel and source distribution
        run: python -m build .test-artifacts/pi-build-source --outdir .test-artifacts/pi-dist
      - name: Check distributions
        run: python -m twine check .test-artifacts/pi-dist/*
