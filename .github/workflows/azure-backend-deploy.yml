name: Deploy Azure backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "azure-backend/**"
      - "contracts/**"
      - "azure.yaml"
      - ".github/workflows/azure-backend-deploy.yml"

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: Azure/setup-azd@v2
      - name: Authenticate Azure Developer CLI
        run: >-
          azd auth login
          --client-id "$AZURE_CLIENT_ID"
          --tenant-id "$AZURE_TENANT_ID"
          --federated-credential-provider github
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Configure Azure Developer CLI environment
        shell: bash
        env:
          AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_BACKEND_NAME: ${{ vars.AZURE_BACKEND_NAME }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          : "${AZURE_ENV_NAME:?Set the AZURE_ENV_NAME environment variable}"
          : "${AZURE_LOCATION:?Set the AZURE_LOCATION environment variable}"
          : "${AZURE_SUBSCRIPTION_ID:?Set the AZURE_SUBSCRIPTION_ID secret}"
          : "${AZURE_BACKEND_NAME:?Set the AZURE_BACKEND_NAME environment variable}"
          : "${AZURE_RESOURCE_GROUP:?Set the AZURE_RESOURCE_GROUP environment variable}"
          azd env new "$AZURE_ENV_NAME" --no-prompt
          azd env set AZURE_SUBSCRIPTION_ID "$AZURE_SUBSCRIPTION_ID"
          azd env set AZURE_LOCATION "$AZURE_LOCATION"
          azd env set AZURE_BACKEND_NAME "$AZURE_BACKEND_NAME"
          azd env set AZURE_RESOURCE_GROUP "$AZURE_RESOURCE_GROUP"
      - name: Deploy backend only
        run: azd deploy azure-backend --no-prompt
        env:
          AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_BACKEND_NAME: ${{ vars.AZURE_BACKEND_NAME }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
