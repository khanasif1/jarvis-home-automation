name: Pi client release

on:
  push:
    tags:
      - "pi-v*"

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pi-client/requirements-dev.txt
      - name: Validate tag version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#pi-v}"
          package_version="$(python -c "import runpy; print(runpy.run_path('pi-client/src/home_assistant_pi/version.py')['__version__'])")"
          test "$version" = "$package_version"
      - name: Install build dependencies
        run: python -m pip install --requirement pi-client/requirements-dev.txt
      - name: Test
        run: python -m pytest pi-client/tests --basetemp=.test-artifacts/pytest/pi-client
      - name: Verify private release authentication
        run: bash pi-client/tests/update-auth-smoke.sh
      - name: Build release artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#pi-v}"
          ./pi-client/packaging/build-release.sh \
            --version "$version" \
            --output-dir "$GITHUB_WORKSPACE/.test-artifacts/pi-release"
      - name: Verify release checksums
        working-directory: .test-artifacts/pi-release/dist
        run: sha256sum --check SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          .test-artifacts/pi-release/dist/*
          --verify-tag
          --generate-notes
          --title "Home Assistant Pi ${GITHUB_REF_NAME#pi-v}"
